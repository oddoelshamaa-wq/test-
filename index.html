<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل فري - نظام التتبع GPS</title>
    <!-- Leaflet للخريطة -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- خطوط عربية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- أيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0f1a;
            --bg-secondary: #111827;
            --bg-card: #1a2236;
            --border: #2a3550;
            --accent: #00e68a;
            --accent-dim: rgba(0, 230, 138, 0.15);
            --accent-glow: rgba(0, 230, 138, 0.4);
            --danger: #ff4757;
            --warning: #ffa502;
            --text-primary: #e8ecf4;
            --text-secondary: #8892a8;
            --text-muted: #555f75;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        /* ===== شاشة التحميل ===== */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #00b36b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: var(--bg-primary);
            margin-bottom: 24px;
            animation: pulse-glow 1.5s ease-in-out infinite;
            box-shadow: 0 0 40px var(--accent-glow), 0 0 80px rgba(0, 230, 138, 0.15);
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px var(--accent-glow); }
            50% { transform: scale(1.08); box-shadow: 0 0 60px var(--accent-glow), 0 0 100px rgba(0, 230, 138, 0.2); }
        }

        .loading-text {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .loading-sub {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .loading-bar-track {
            width: 240px;
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .loading-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), #00ffaa);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* ===== الهيكل الرئيسي ===== */
        .app-container {
            display: flex;
            height: 100vh;
            opacity: 0;
            transition: opacity 0.5s ease 0.3s;
        }

        .app-container.visible {
            opacity: 1;
        }

        /* ===== الشريط الجانبي ===== */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 100;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* الهيدر */
        .sidebar-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #00b36b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--bg-primary);
            flex-shrink: 0;
        }

        .header-info h1 {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: -0.3px;
        }

        .header-info span {
            font-size: 11px;
            color: var(--accent);
            font-weight: 600;
            background: var(--accent-dim);
            padding: 2px 8px;
            border-radius: 20px;
        }

        /* حالة الاتصال */
        .connection-status {
            margin: 16px 20px;
            padding: 14px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.4s ease;
        }

        .connection-status.connecting {
            background: rgba(255, 165, 2, 0.1);
            border: 1px solid rgba(255, 165, 2, 0.3);
            color: var(--warning);
        }

        .connection-status.connected {
            background: var(--accent-dim);
            border: 1px solid rgba(0, 230, 138, 0.3);
            color: var(--accent);
        }

        .connection-status.error {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: var(--danger);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            animation: blink 1.2s ease-in-out infinite;
        }

        .connecting .status-dot { background: var(--warning); }
        .connected .status-dot { background: var(--accent); animation: none; }
        .error .status-dot { background: var(--danger); animation: none; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* بطاقات المعلومات */
        .info-section {
            padding: 0 20px;
            margin-bottom: 8px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding-top: 16px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .info-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            transition: border-color 0.3s ease, transform 0.2s ease;
        }

        .info-card:hover {
            border-color: rgba(0, 230, 138, 0.3);
            transform: translateY(-1px);
        }

        .info-card.full-width {
            grid-column: 1 / -1;
        }

        .info-card .label {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-card .label i {
            font-size: 11px;
            color: var(--accent);
        }

        .info-card .value {
            font-size: 16px;
            font-weight: 900;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            direction: ltr;
            text-align: right;
        }

        .info-card .value.small {
            font-size: 13px;
            font-weight: 600;
        }

        /* بطاقة السرعة الكبيرة */
        .speed-card {
            background: linear-gradient(135deg, var(--bg-card), rgba(0, 230, 138, 0.05));
            border: 1px solid rgba(0, 230, 138, 0.2);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            margin: 0 20px 8px;
            position: relative;
            overflow: hidden;
        }

        .speed-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 230, 138, 0.06) 0%, transparent 60%);
            animation: rotate-slow 10s linear infinite;
        }

        @keyframes rotate-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .speed-value {
            font-size: 48px;
            font-weight: 900;
            color: var(--accent);
            line-height: 1;
            position: relative;
            z-index: 1;
            font-variant-numeric: tabular-nums;
        }

        .speed-unit {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }

        .speed-label-top {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        /* زر المشاركة */
        .share-btn {
            margin: 12px 20px 8px;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .share-btn:hover {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent);
        }

        .share-btn:active {
            transform: scale(0.97);
        }

        /* أزرار التحكم */
        .controls-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 20px;
            margin-bottom: 8px;
        }

        .ctrl-btn {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-family: 'Cairo', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .ctrl-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        .ctrl-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .ctrl-btn.active:hover {
            background: #00cc7a;
        }

        /* سجل التتبع */
        .track-log {
            margin: 0 20px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .track-log-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .track-log-header h3 {
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .track-log-header h3 i {
            color: var(--accent);
            font-size: 14px;
        }

        .log-count {
            font-size: 11px;
            background: var(--accent-dim);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 700;
        }

        .log-list {
            max-height: 180px;
            overflow-y: auto;
            padding: 8px;
        }

        .log-list::-webkit-scrollbar {
            width: 3px;
        }

        .log-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .log-item {
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            transition: background 0.2s ease;
        }

        .log-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .log-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }

        .log-time {
            color: var(--text-muted);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            direction: ltr;
            min-width: 70px;
        }

        .log-text {
            color: var(--text-secondary);
            flex: 1;
        }

        /* ===== منطقة الخريطة ===== */
        .map-area {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* تخصيص ألوان الخريطة */
        .leaflet-tile-pane {
            filter: saturate(0.3) brightness(0.65) contrast(1.1);
        }

        .leaflet-control-zoom a {
            background: var(--bg-card) !important;
            color: var(--text-primary) !important;
            border-color: var(--border) !important;
            width: 36px !important;
            height: 36px !important;
            line-height: 36px !important;
            font-size: 18px !important;
        }

        .leaflet-control-zoom a:hover {
            background: var(--accent) !important;
            color: var(--bg-primary) !important;
        }

        /* شريط الأدوات العائم على الخريطة */
        .map-toolbar {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .map-tool-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .map-tool-btn:hover {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .map-tool-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        /* مؤشر الدقة على الخريطة */
        .accuracy-badge {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .accuracy-badge i {
            color: var(--accent);
        }

        /* التنبيهات */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            animation: toast-in 0.4s ease;
            backdrop-filter: blur(10px);
        }

        .toast.success { border-color: var(--accent); }
        .toast.success i { color: var(--accent); }
        .toast.error { border-color: var(--danger); }
        .toast.error i { color: var(--danger); }
        .toast.warning { border-color: var(--warning); }
        .toast.warning i { color: var(--warning); }

        @keyframes toast-in {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .toast.fade-out {
            animation: toast-out 0.3s ease forwards;
        }

        @keyframes toast-out {
            to { opacity: 0; transform: translateY(-20px); }
        }

        /* زر القائمة للموبايل */
        .mobile-toggle {
            display: none;
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1001;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        /* مؤشر مخصص على الخريطة */
        .custom-marker {
            position: relative;
        }

        .marker-dot {
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 20px var(--accent-glow), 0 2px 10px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 2;
        }

        .marker-pulse {
            width: 50px;
            height: 50px;
            background: rgba(0, 230, 138, 0.2);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            animation: marker-ping 2s ease-out infinite;
        }

        .marker-pulse-2 {
            animation-delay: 0.5s;
        }

        @keyframes marker-ping {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }

        .marker-label {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;
            font-family: 'Cairo', sans-serif;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .marker-label::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: var(--border);
        }

        /* دائرة الدقة */
        .accuracy-circle {
            fill: rgba(0, 230, 138, 0.08);
            stroke: rgba(0, 230, 138, 0.2);
            stroke-width: 1;
        }

        /* ريسبونسف */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                top: 0;
                right: 0;
                height: 100%;
                transform: translateX(100%);
                transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
                z-index: 1000;
                box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-toggle {
                display: flex;
            }

            .sidebar-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 999;
            }

            .sidebar-overlay.show {
                display: block;
            }
        }

        /* خلفية متحركة للشريط الجانبي */
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: radial-gradient(ellipse at top right, rgba(0, 230, 138, 0.06), transparent 70%);
            pointer-events: none;
        }

        .sidebar {
            position: relative;
        }

        /* اتجاه البوصلة */
        .compass {
            width: 50px;
            height: 50px;
            margin: 0 auto;
            position: relative;
        }

        .compass-ring {
            width: 100%;
            height: 100%;
            border: 2px solid var(--border);
            border-radius: 50%;
            position: relative;
        }

        .compass-needle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 20px;
            background: linear-gradient(to bottom, var(--danger) 50%, var(--text-muted) 50%);
            transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg);
            transition: transform 0.5s ease;
            border-radius: 2px;
        }

        .compass-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: var(--text-primary);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .compass-n {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            font-weight: 900;
            color: var(--danger);
        }
    </style>
</head>
<body>

    <!-- شاشة التحميل -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-logo">
            <i class="fas fa-location-crosshairs"></i>
        </div>
        <div class="loading-text">دليل فري</div>
        <div class="loading-sub">جاري تحديد موقعك على GPS...</div>
        <div class="loading-bar-track">
            <div class="loading-bar-fill" id="loadingBar"></div>
        </div>
    </div>

    <!-- تنبيهات -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- غطاء للشريط الجانبي على الموبايل -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- التطبيق الرئيسي -->
    <div class="app-container" id="appContainer">

        <!-- زر فتح القائمة على الموبايل -->
        <button class="mobile-toggle" id="mobileToggle" aria-label="فتح القائمة">
            <i class="fas fa-bars"></i>
        </button>

        <!-- الشريط الجانبي -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="header-icon">
                    <i class="fas fa-satellite-dish"></i>
                </div>
                <div class="header-info">
                    <h1>دليل فري</h1>
                    <span>مدير النظام</span>
                </div>
            </div>

            <!-- حالة الاتصال -->
            <div class="connection-status connecting" id="connectionStatus">
                <div class="status-dot"></div>
                <span id="connectionText">جاري البحث عن إشارة GPS...</span>
            </div>

            <!-- بطاقة السرعة -->
            <div class="speed-card">
                <div class="speed-label-top">السرعة الحالية</div>
                <div class="speed-value" id="speedValue">0</div>
                <div class="speed-unit">كم/ساعة</div>
            </div>

            <!-- معلومات الموقع -->
            <div class="info-section">
                <div class="section-title">الإحداثيات</div>
                <div class="info-grid">
                    <div class="info-card">
                        <div class="label"><i class="fas fa-arrows-up-down"></i> خط العرض</div>
                        <div class="value" id="latValue">--</div>
                    </div>
                    <div class="info-card">
                        <div class="label"><i class="fas fa-arrows-left-right"></i> خط الطول</div>
                        <div class="value" id="lngValue">--</div>
                    </div>
                </div>
            </div>

            <div class="info-section">
                <div class="section-title">تفاصيل الموقع</div>
                <div class="info-grid">
                    <div class="info-card">
                        <div class="label"><i class="fas fa-bullseye"></i> الدقة</div>
                        <div class="value small" id="accuracyValue">--</div>
                    </div>
                    <div class="info-card">
                        <div class="label"><i class="fas fa-mountain"></i> الارتفاع</div>
                        <div class="value small" id="altitudeValue">--</div>
                    </div>
                    <div class="info-card full-width">
                        <div class="label"><i class="fas fa-road"></i> العنوان</div>
                        <div class="value small" id="addressValue" style="text-align: right; direction: rtl; font-size: 12px;">جاري التحميل...</div>
                    </div>
                </div>
            </div>

            <div class="info-section">
                <div class="section-title">الإتجاه</div>
                <div class="info-grid" style="grid-template-columns: 1fr 80px;">
                    <div class="info-card" style="display: flex; flex-direction: column; justify-content: center;">
                        <div class="label"><i class="fas fa-compass"></i> بوصلة</div>
                        <div class="value small" id="headingValue">--</div>
                    </div>
                    <div class="info-card" style="display: flex; align-items: center; justify-content: center; padding: 8px;">
                        <div class="compass">
                            <div class="compass-ring">
                                <span class="compass-n">N</span>
                                <div class="compass-needle" id="compassNeedle"></div>
                                <div class="compass-center"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- أزرار التحكم -->
            <div class="info-section">
                <div class="section-title">تحكم</div>
            </div>
            <div class="controls-row">
                <button class="ctrl-btn active" id="btnTrack" onclick="toggleTracking()">
                    <i class="fas fa-play"></i>
                    تتبع
                </button>
                <button class="ctrl-btn" id="btnFollow" onclick="toggleFollow()">
                    <i class="fas fa-crosshairs"></i>
                    تثبيت
                </button>
                <button class="ctrl-btn" id="btnPath" onclick="togglePath()">
                    <i class="fas fa-route"></i>
                    المسار
                </button>
                <button class="ctrl-btn" id="btnNight" onclick="toggleMapStyle()">
                    <i class="fas fa-moon"></i>
                    ليلي
                </button>
            </div>

            <!-- زر مشاركة الموقع -->
            <button class="share-btn" onclick="shareLocation()">
                <i class="fas fa-share-nodes"></i>
                مشاركة موقعي الآن
            </button>

            <!-- سجل التتبع -->
            <div class="track-log">
                <div class="track-log-header">
                    <h3><i class="fas fa-clock-rotate-left"></i> سجل التتبع</h3>
                    <span class="log-count" id="logCount">0</span>
                </div>
                <div class="log-list" id="logList">
                    <!-- سيتم إضافة السجلات هنا -->
                </div>
            </div>
        </aside>

        <!-- منطقة الخريطة -->
        <div class="map-area">
            <!-- شريط أدوات عائم -->
            <div class="map-toolbar">
                <button class="map-tool-btn" onclick="centerOnMe()" title="موقعي الحالي">
                    <i class="fas fa-location-arrow"></i>
                </button>
                <button class="map-tool-btn" onclick="zoomIn()" title="تكبير">
                    <i class="fas fa-plus"></i>
                </button>
                <button class="map-tool-btn" onclick="zoomOut()" title="تصغير">
                    <i class="fas fa-minus"></i>
                </button>
                <button class="map-tool-btn" onclick="toggleFullscreen()" title="ملء الشاشة">
                    <i class="fas fa-expand"></i>
                </button>
            </div>

            <!-- شارة الدقة -->
            <div class="accuracy-badge" id="accuracyBadge">
                <i class="fas fa-satellite"></i>
                <span id="accuracyBadgeText">في انتظار الإشارة...</span>
            </div>

            <!-- الخريطة -->
            <div id="map"></div>
        </div>
    </div>

    <script>
        // ===== المتغيرات العامة =====
        let map = null;
        let marker = null;
        let accuracyCircle = null;
        let pathLine = null;
        let watchId = null;
        let isTracking = true;
        let isFollowing = false;
        let showPath = false;
        let isNightMode = true;
        let pathCoords = [];
        let logEntries = [];
        let lastPosition = null;
        let lastSpeed = 0;
        let currentTileLayer = null;

        // ===== تحميل شريط التقدم =====
        let loadProgress = 0;
        const loadingBar = document.getElementById('loadingBar');
        const loadingScreen = document.getElementById('loadingScreen');
        const appContainer = document.getElementById('appContainer');

        function updateLoadingBar(target) {
            loadProgress = target;
            loadingBar.style.width = loadProgress + '%';
        }

        // ===== تهيئة الخريطة =====
        function initMap() {
            updateLoadingBar(20);

            // إنشاء الخريطة - مركز مؤقت (القاهرة)
            map = L.map('map', {
                center: [30.0444, 31.2357],
                zoom: 15,
                zoomControl: false,
                attributionControl: false
            });

            updateLoadingBar(40);

            // طبقة الخريطة الليلية
            setNightTile();

            updateLoadingBar(60);

            // إضافة تحكم التكبير في اليمين
            L.control.zoom({ position: 'topleft' }).addTo(map);

            updateLoadingBar(80);

            // إنشاء المسار
            pathLine = L.polyline([], {
                color: '#00e68a',
                weight: 3,
                opacity: 0.7,
                smoothFactor: 1,
                dashArray: '8, 8'
            });

            updateLoadingBar(90);

            // بدء تتبع GPS
            startTracking();

            updateLoadingBar(100);

            // إخفاء شاشة التحميل بعد فترة
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
                appContainer.classList.add('visible');
            }, 800);
        }

        // ===== طبقات الخريطة =====
        function setNightTile() {
            if (currentTileLayer) map.removeLayer(currentTileLayer);
            currentTileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                subdomains: 'abcd'
            }).addTo(map);
        }

        function setDayTile() {
            if (currentTileLayer) map.removeLayer(currentTileLayer);
            currentTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);
            // إزالة الفلتر الليلي
            document.querySelector('.leaflet-tile-pane').style.filter = 'none';
        }

        // ===== إنشاء المؤشر المخصص =====
        function createCustomMarker(lat, lng) {
            const icon = L.divIcon({
                className: 'custom-marker',
                html: `
                    <div class="marker-pulse"></div>
                    <div class="marker-pulse marker-pulse-2"></div>
                    <div class="marker-dot"></div>
                    <div class="marker-label">موقع المدير</div>
                `,
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
            return L.marker([lat, lng], { icon: icon, zIndexOffset: 1000 });
        }

        // ===== بدء التتبع =====
        function startTracking() {
            if (!navigator.geolocation) {
                setConnectionStatus('error', 'المتصفح لا يدعم GPS');
                showToast('error', 'المتصفح لا يدعم تحديد الموقع');
                return;
            }

            setConnectionStatus('connecting', 'جاري البحث عن إشارة GPS...');

            watchId = navigator.geolocation.watchPosition(
                onPositionSuccess,
                onPositionError,
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        }

        // ===== نجاح تحديد الموقع =====
        function onPositionSuccess(position) {
            const { latitude, longitude, accuracy, altitude, speed, heading } = position.coords;
            const timestamp = position.timestamp;

            // تحديث حالة الاتصال
            if (accuracy <= 10) {
                setConnectionStatus('connected', 'إشارة GPS قوية - دقة عالية');
            } else if (accuracy <= 30) {
                setConnectionStatus('connected', 'إشارة GPS متوسطة');
            } else {
                setConnectionStatus('connected', 'إشارة GPS ضعيفة - جاري التحسين...');
            }

            // تحديث المؤشر
            if (marker) {
                marker.setLatLng([latitude, longitude]);
            } else {
                marker = createCustomMarker(latitude, longitude).addTo(map);
                // تكبير على الموقع الأول
                map.flyTo([latitude, longitude], 17, { duration: 1.5 });
                addLogEntry('تم تحديد الموقع بنجاح');
                showToast('success', 'تم تحديد موقعك على الخريطة');
            }

            // تحديث دائرة الدقة
            if (accuracyCircle) {
                accuracyCircle.setLatLng([latitude, longitude]);
                accuracyCircle.setRadius(accuracy);
            } else {
                accuracyCircle = L.circle([latitude, longitude], {
                    radius: accuracy,
                    color: '#00e68a',
                    fillColor: '#00e68a',
                    fillOpacity: 0.08,
                    weight: 1,
                    opacity: 0.2
                }).addTo(map);
            }

            // تثبيت الخريطة على الموقع
            if (isFollowing) {
                map.panTo([latitude, longitude], { animate: true, duration: 0.5 });
            }

            // إضافة نقطة للمسار
            if (showPath) {
                pathCoords.push([latitude, longitude]);
                pathLine.setLatLngs(pathCoords);
                if (!map.hasLayer(pathLine)) {
                    pathLine.addTo(map);
                }
            }

            // حساب السرعة
            let displaySpeed = 0;
            if (speed !== null && speed >= 0) {
                displaySpeed = Math.round(speed * 3.6); // تحويل من م/ث إلى كم/س
            } else if (lastPosition) {
                // حساب السرعة يدوياً
                const dist = getDistance(lastPosition.lat, lastPosition.lng, latitude, longitude);
                const timeDiff = (timestamp - lastPosition.time) / 1000; // ثواني
                if (timeDiff > 0) {
                    displaySpeed = Math.round((dist / timeDiff) * 3.6);
                }
            }

            // تنعيم السرعة
            lastSpeed = Math.round(lastSpeed * 0.6 + displaySpeed * 0.4);

            // تحديث البيانات في الواجهة
            document.getElementById('latValue').textContent = latitude.toFixed(6);
            document.getElementById('lngValue').textContent = longitude.toFixed(6);
            document.getElementById('accuracyValue').textContent = accuracy.toFixed(1) + ' م';
            document.getElementById('altitudeValue').textContent = altitude !== null ? altitude.toFixed(1) + ' م' : 'غير متوفر';
            document.getElementById('speedValue').textContent = lastSpeed;

            // شارة الدقة
            const accBadge = document.getElementById('accuracyBadgeText');
            if (accuracy <= 10) {
                accBadge.textContent = 'دقة عالية - ' + accuracy.toFixed(1) + ' م';
            } else if (accuracy <= 50) {
                accBadge.textContent = 'دقة متوسطة - ' + accuracy.toFixed(1) + ' م';
            } else {
                accBadge.textContent = 'دقة منخفضة - ' + accuracy.toFixed(1) + ' م';
            }

            // الاتجاه
            if (heading !== null && !isNaN(heading)) {
                document.getElementById('headingValue').textContent = heading.toFixed(1) + '°';
                document.getElementById('compassNeedle').style.transform = `translate(-50%, -100%) rotate(${heading}deg)`;
            }

            // الحصول على العنوان
            reverseGeocode(latitude, longitude);

            // تسجيل حركة
            if (lastPosition && lastSpeed > 5) {
                const dist = getDistance(lastPosition.lat, lastPosition.lng, latitude, longitude);
                if (dist > 50) { // كل 50 متر
                    addLogEntry(`تحرك ${dist.toFixed(0)} م - سرعة ${lastSpeed} كم/س`);
                }
            }

            lastPosition = { lat: latitude, lng: longitude, time: timestamp };
        }

        // ===== خطأ تحديد الموقع =====
        function onPositionError(error) {
            let msg = '';
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    msg = 'تم رفض إذن الوصول للموقع';
                    break;
                case error.POSITION_UNAVAILABLE:
                    msg = 'معلومات الموقع غير متوفرة';
                    break;
                case error.TIMEOUT:
                    msg = 'انتهت مهلة تحديد الموقع';
                    break;
                default:
                    msg = 'حدث خطأ غير معروف';
            }
            setConnectionStatus('error', msg);
            showToast('error', msg);

            // إعادة المحاولة بعد 5 ثواني
            if (isTracking) {
                setTimeout(() => {
                    if (isTracking) {
                        startTracking();
                        addLogEntry('إعادة محاولة الاتصال بـ GPS...');
                    }
                }, 5000);
            }
        }

        // ===== الحصول على العنوان =====
        let geocodeTimeout = null;
        function reverseGeocode(lat, lng) {
            // تحديد العنوان كل 10 ثواني فقط
            if (geocodeTimeout) return;
            geocodeTimeout = setTimeout(() => { geocodeTimeout = null; }, 10000);

            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ar`)
                .then(res => res.json())
                .then(data => {
                    if (data.display_name) {
                        const parts = data.display_name.split(',');
                        const short = parts.slice(0, 3).join(', ');
                        document.getElementById('addressValue').textContent = short;
                    }
                })
                .catch(() => {
                    document.getElementById('addressValue').textContent = 'لا يمكن تحديد العنوان';
                });
        }

        // ===== حساب المسافة =====
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000; // متر
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // ===== حالة الاتصال =====
        function setConnectionStatus(state, text) {
            const el = document.getElementById('connectionStatus');
            const textEl = document.getElementById('connectionText');
            el.className = 'connection-status ' + state;
            textEl.textContent = text;
        }

        // ===== التنبيهات =====
        function showToast(type, message) {
            const container = document.getElementById('toastContainer');
            const icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-triangle' };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${icons[type]}"></i> ${message}`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // ===== سجل التتبع =====
        function addLogEntry(text) {
            const now = new Date();
            const time = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            logEntries.unshift({ time, text });
            if (logEntries.length > 50) logEntries.pop();

            const logList = document.getElementById('logList');
            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerHTML = `
                <div class="log-dot"></div>
                <span class="log-time">${time}</span>
                <span class="log-text">${text}</span>
            `;
            logList.prepend(item);

            document.getElementById('logCount').textContent = logEntries.length;
        }

        // ===== أزرار التحكم =====
        function toggleTracking() {
            isTracking = !isTracking;
            const btn = document.getElementById('btnTrack');

            if (isTracking) {
                btn.classList.add('active');
                btn.innerHTML = '<i class="fas fa-play"></i> تتبع';
                startTracking();
                addLogEntry('تم تشغيل التتبع');
                showToast('success', 'تم تشغيل التتبع');
            } else {
                btn.classList.remove('active');
                btn.innerHTML = '<i class="fas fa-pause"></i> إيقاف';
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                setConnectionStatus('error', 'التتبع متوقف');
                addLogEntry('تم إيقاف التتبع');
                showToast('warning', 'تم إيقاف التتبع');
            }
        }

        function toggleFollow() {
            isFollowing = !isFollowing;
            const btn = document.getElementById('btnFollow');

            if (isFollowing) {
                btn.classList.add('active');
                if (lastPosition) {
                    map.flyTo([lastPosition.lat, lastPosition.lng], map.getZoom(), { duration: 0.5 });
                }
                addLogEntry('تم تفعيل تثبيت الخريطة');
            } else {
                btn.classList.remove('active');
                addLogEntry('تم إلغاء تثبيت الخريطة');
            }
        }

        function togglePath() {
            showPath = !showPath;
            const btn = document.getElementById('btnPath');

            if (showPath) {
                btn.classList.add('active');
                pathCoords = [];
                if (lastPosition) {
                    pathCoords.push([lastPosition.lat, lastPosition.lng]);
                }
                addLogEntry('بدء تسجيل المسار');
                showToast('success', 'بدء تسجيل المسار');
            } else {
                btn.classList.remove('active');
                if (map.hasLayer(pathLine)) {
                    map.removeLayer(pathLine);
                }
                pathLine = L.polyline([], {
                    color: '#00e68a',
                    weight: 3,
                    opacity: 0.7,
                    smoothFactor: 1,
                    dashArray: '8, 8'
                });
                pathCoords = [];
                addLogEntry('تم إيقاف تسجيل المسار');
                showToast('warning', 'تم إيقاف تسجيل المسار');
            }
        }

        function toggleMapStyle() {
            isNightMode = !isNightMode;
            const btn = document.getElementById('btnNight');
            const tilePane = document.querySelector('.leaflet-tile-pane');

            if (isNightMode) {
                btn.classList.remove('active');
                btn.innerHTML = '<i class="fas fa-moon"></i> ليلي';
                setNightTile();
                tilePane.style.filter = 'saturate(0.3) brightness(0.65) contrast(1.1)';
            } else {
                btn.classList.add('active');
                btn.innerHTML = '<i class="fas fa-sun"></i> نهاري';
                setDayTile();
                tilePane.style.filter = 'none';
            }
        }

        // ===== أدوات الخريطة =====
        function centerOnMe() {
            if (lastPosition) {
                map.flyTo([lastPosition.lat, lastPosition.lng], 17, { duration: 1 });
            } else {
                showToast('warning', 'لم يتم تحديد الموقع بعد');
            }
        }

        function zoomIn() {
            map.zoomIn();
        }

        function zoomOut() {
            map.zoomOut();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        }

        // ===== مشاركة الموقع =====
        function shareLocation() {
            if (!lastPosition) {
                showToast('warning', 'لم يتم تحديد الموقع بعد');
                return;
            }

            const url = `https://www.google.com/maps?q=${lastPosition.lat},${lastPosition.lng}`;
            const text = `موقعي الحالي:\n${url}\nالإحداثيات: ${lastPosition.lat.toFixed(6)}, ${lastPosition.lng.toFixed(6)}`;

            if (navigator.share) {
                navigator.share({
                    title: 'موقعي - دليل فري',
                    text: text,
                    url: url
                }).catch(() => {});
            } else {
                // نسخ للclipboard
                navigator.clipboard.writeText(text).then(() => {
                    showToast('success', 'تم نسخ رابط الموقع');
                }).catch(() => {
                    // fallback
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    textarea.remove();
                    showToast('success', 'تم نسخ رابط الموقع');
                });
            }

            addLogEntry('تم مشاركة الموقع');
        }

        // ===== القائمة الجانبية للموبايل =====
        const mobileToggle = document.getElementById('mobileToggle');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        mobileToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('show');
        });

        sidebarOverlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('show');
        });

        // ===== تحديث الساعة في السرعة (تأثير حي) =====
        let speedAnimFrame = 0;
        function animateSpeed() {
            speedAnimFrame++;
            const speedEl = document.getElementById('speedValue');
            // تأثير اهتزاز خفيف عند الحركة
            if (lastSpeed > 5) {
                const shake = Math.sin(speedAnimFrame * 0.1) * 0.5;
                speedEl.style.transform = `translateX(${shake}px)`;
            } else {
                speedEl.style.transform = 'none';
            }
            requestAnimationFrame(animateSpeed);
        }

        // ===== تهيئة عند تحميل الصفحة =====
        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            animateSpeed();
            addLogEntry('تم تشغيل النظام');
        });

        // ===== تحديث الوقت كل دقيقة في السجل =====
        setInterval(() => {
            if (isTracking && lastPosition) {
                addLogEntry(`محدث - سرعة ${lastSpeed} كم/س`);
            }
        }, 60000);
    </script>
</body>
</html>
